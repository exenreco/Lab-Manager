name: Android and iOS builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify and package APK
        run: |
          mkdir -p ../dist/mobile
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/mobile/Lab-Manager-0.1.0-android-test-signed.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose ../dist/mobile/Lab-Manager-0.1.0-android-test-signed.apk
          cd ../dist/mobile
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Lab-Manager-Android
          path: dist/mobile/*
          if-no-files-found: error
          retention-days: 30
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned device app
        run: |
          mkdir -p ../dist/mobile
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../dist/mobile/Lab-Manager-0.1.0-ios-unsigned-device.app.zip
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app ../dist/mobile/Lab-Manager-0.1.0-ios-simulator.app.zip
          cd ../dist/mobile
          shasum -a 256 *.zip > SHA256SUMS-ios.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Lab-Manager-iOS
          path: dist/mobile/*
          if-no-files-found: error
          retention-days: 30
