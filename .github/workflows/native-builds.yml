name: Linux and macOS builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev xvfb
      - name: Verify
        run: |
          cargo fetch --locked
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --release
      - name: License notices
        run: python3 scripts/third_party.py
      - name: Package
        run: python3 scripts/package_unix.py
      - uses: actions/upload-artifact@v4
        with:
          name: Lab-Manager-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30
